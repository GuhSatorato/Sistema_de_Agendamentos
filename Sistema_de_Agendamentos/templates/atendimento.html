<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento - Academia da Saúde</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Academia da Saúde</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Agenda</a>
                <a class="nav-link" href="/pacientes">Pacientes</a>
                <a class="nav-link" href="/agendar">Novo Agendamento</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="col-md-6 mx-auto">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h4 border-bottom pb-2 mb-3">Registro de Atendimento</h2>
                    
                    <div class="alert alert-info py-2">
                        <strong>Paciente:</strong> {{ agendamento.nome }}<br>
                        <strong>Horário Marcado:</strong> {{ agendamento.data }} às {{ agendamento.horario }}
                    </div>

                    <form action="/processar_atendimento" method="POST">
                        <input type="hidden" name="agendamento_id" value="{{ agendamento.id }}">

                        <div class="mb-3">
                            <label class="form-label">Evolução / Descrição da Consulta Realizada</label>
                            <textarea name="descricao" class="form-control" rows="4" placeholder="Descreva os exercícios realizados, dor relatada ou evolução do paciente..." required>{{ agendamento.descricao or '' }}</textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" name="acao" value="finalizar" class="btn btn-success py-2">
                                Finalizar Atendimento
                            </button>
                            <button type="submit" name="acao" value="remarcar" class="btn btn-warning py-2">
                                Finalizar e Remarcar Próxima Sessão
                            </button>
                            <a href="/" class="btn btn-link text-decoration-none text-muted">Voltar para a Agenda</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
