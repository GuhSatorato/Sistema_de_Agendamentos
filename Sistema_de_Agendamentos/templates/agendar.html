<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Agendamento - Academia da Saúde</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Academia da Saúde</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Agenda</a>
                <a class="nav-link" href="/pacientes">Pacientes</a>
                <a class="nav-link active" href="/agendar">Novo Agendamento</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="col-md-6 mx-auto">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h4 border-bottom pb-2 mb-3">Novo Agendamento</h2>
                    <form action="/salvar_agendamento" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Selecione o Paciente *</label>
                            <select name="paciente_id" class="form-select" required>
                                <option value="">Escolha um paciente cadastrado...</option>
                                {% for p in pacientes %}
                                <option value="{{ p.id }}">{{ p.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Data *</label>
                                <input type="date" name="data" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Horário *</label>
                                <input type="time" name="horario" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descrição / Motivo do Agendamento</label>
                            <textarea name="descricao" class="form-control" rows="3" placeholder="Ex: Avaliação física inicial, fisioterapia lombar..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2">Confirmar Agendamento</button>
                        <a href="/" class="btn btn-link w-100 mt-2 text-decoration-none text-muted">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
